set timeout=0
set default=0

# Enable VESA linear framebuffer (required for GUI mode).
# grub-mkrescue / GRUB 2 honours the Multiboot VIDEO_MODE flag (bit 2)
# and fills multiboot_info_t::framebuffer_* so our fb_init() can use it.
insmod all_video
insmod vbe
insmod vga
insmod video_bochs
insmod video_cirrus
set gfxpayload=1024x768x32

menuentry "RabinOS" {
    multiboot /boot/kernel.elf
    module    /modules/program
    boot
}
